# Keeps the application on the newest published version of its recipe. Weekly (or when started by hand) it designs that
# version with the answers in .aepm/definition.json, has aepm stage the update and run the packages' checks, and opens a
# pull request carrying the new definition. Merging the pull request applies it: aepm proposes it again, the owner key in
# the AEPM_OWNER_KEY secret approves it, aepm applies it and the result is committed to main.
name: aepm-update

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: Recipe version to propose (empty for the newest published)
        type: string
        required: false
  push:
    branches: [main]
    paths: [".aepm/update/definition.json"]

concurrency:
  group: aepm-update
  cancel-in-progress: false

jobs:
  propose:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.5"
      - run: git clone --depth 1 https://github.com/ourapps-ae/aepm "$RUNNER_TEMP/aepm"
      - id: update
        env:
          VERSION: ${{ inputs.version }}
        run: python3 components/ourapps-release/server/scripts/aepm_update.py propose --aepm "$RUNNER_TEMP/aepm" --work "$RUNNER_TEMP/aepm-work" ${VERSION:+--version "$VERSION"}
      - name: Open the pull request
        if: steps.update.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          branch="aepm-update/$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch exists already"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .aepm/update/definition.json .aepm/update/summary.md
          git commit -m "Propose the update to recipe version $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Update to recipe version $VERSION" --body-file .aepm/update/summary.md

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.5"
      - run: git clone --depth 1 https://github.com/ourapps-ae/aepm "$RUNNER_TEMP/aepm"
      - name: Write the owner key
        env:
          AEPM_OWNER_KEY: ${{ secrets.AEPM_OWNER_KEY }}
        run: |
          if [[ -z "$AEPM_OWNER_KEY" ]]; then
            echo "::error::Set the AEPM_OWNER_KEY repository secret to the owner's private key (owner.pem) to apply updates."
            exit 1
          fi
          umask 077
          printf '%s\n' "$AEPM_OWNER_KEY" > "$RUNNER_TEMP/owner.pem"
      - id: update
        run: python3 components/ourapps-release/server/scripts/aepm_update.py apply --aepm "$RUNNER_TEMP/aepm" --work "$RUNNER_TEMP/aepm-work" --owner-key "$RUNNER_TEMP/owner.pem"
      - name: Commit the updated application
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          rm -f "$RUNNER_TEMP/owner.pem"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update to recipe version $VERSION"
          git push origin HEAD:main
