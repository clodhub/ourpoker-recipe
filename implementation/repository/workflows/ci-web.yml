# The web client's type check and build, then a hand played in headless Chrome against the server started on the runner,
# when the web client, the server, its text, the rules or a component changes.
name: ci-web

on:
  push:
    branches: [main]
    paths: ["web/**", "server/**", "resources/**", "rules/**", "components/**", ".github/workflows/ci-web.yml"]
  pull_request:
    paths: ["web/**", "server/**", "resources/**", "rules/**", "components/**", ".github/workflows/ci-web.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a check still running.
concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.5"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci
        working-directory: server
      - name: Start the server and serve the web client built against it
        run: |
          (cd server && PORT=8788 HOST=127.0.0.1 DATA_DIRECTORY="$RUNNER_TEMP/rooms" npm start > "$RUNNER_TEMP/server.log" 2>&1 &)
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8788/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8788/health
          cd web
          VITE_SERVER=http://127.0.0.1:8788 npm run build -- --outDir "$RUNNER_TEMP/web-check-dist"
          (npx vite preview --outDir "$RUNNER_TEMP/web-check-dist" --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &)
          for _ in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:5173/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:5173/
      - name: Play a hand in headless Chrome
        working-directory: web
        run: |
          WEB_CHECK_URL=http://127.0.0.1:5173/ WEB_CHECK_SERVER=http://127.0.0.1:8788 WEB_CHECK_OUT="$RUNNER_TEMP/web-check" \
            CHROME="$(command -v google-chrome)" node test/browser.mjs
      - name: Stop the local servers
        if: always()
        run: |
          mapfile -t pids < <(lsof -t -sTCP:LISTEN -i tcp:8788 -i tcp:5173 || true)
          if (( ${#pids[@]} )); then kill "${pids[@]}"; fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-check
          path: |
            ${{ runner.temp }}/web-check/*.png
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/preview.log
          if-no-files-found: ignore
